# Colophon quick start (D-174, D-175): Colophon with PostgreSQL, Valkey and Garage on one
# machine, from Docker alone. Separate from the development stack (deploy/compose.yaml), whose
# rules and public credentials stay as they are.
#
#   docker compose up -d --wait
#   open http://localhost:8080/studio/
#   docker compose logs colophon | grep "Setup code"     # the first administrator's code
#
# How it is put together:
# - Every service shares one network namespace, owned by the `pod` container. Only Colophon's
#   port is published, and only on 127.0.0.1. PostgreSQL, Valkey and Garage listen on
#   127.0.0.1 inside it, so they are loopback to Colophon and unreachable from the host or any
#   other container: the plaintext rules (S3 over HTTP and an unencrypted database only on
#   loopback) hold with no exceptions.
# - Secrets are generated on the first start by the `secrets` job into volumes of their own
#   (each file mode 0400, owned by the one service that reads it) and read through `*_FILE`
#   settings. Nothing secret is in this file, the image, or any environment variable.
# - `roles` and `migrate` create the database roles (`colophon admin init-roles`) and apply the
#   schema; `migrate` refuses a database that holds migrations this image doesn't know, so an
#   older image never starts on a newer schema. `storage` creates the bucket and its key.
#   Colophon starts once all three have finished, and `--wait` returns when it is ready.
#
# Settings (environment, or a .env file beside this one):
#   COLOPHON_PORT   the host port, default 8080 (published on 127.0.0.1 only)
#   COLOPHON_IMAGE  the Colophon image; a release's copy of this file pins its digest
#
# Every image is pinned by digest. Upgrades: change COLOPHON_IMAGE (or take the new release's
# file), then `docker compose pull && docker compose up -d --wait`. Backups and everything
# else: deploy/runbooks/install.md.
name: colophon-quickstart

services:
  # Owns the shared network namespace and publishes Colophon's port; does nothing else.
  pod:
    image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
    ports:
      - "127.0.0.1:${COLOPHON_PORT:-8080}:8080"
    restart: unless-stopped

  # Writes every secret once, on the first start; afterwards it finds them and exits.
  secrets:
    image: alpine:3.23@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2
    network_mode: none
    configs:
      - source: make-secrets
        target: /make-secrets.sh
    command: ["sh", "/make-secrets.sh"]
    volumes:
      - secrets-postgres:/secrets/postgres
      - secrets-valkey:/secrets/valkey
      - secrets-garage:/secrets/garage
      - secrets-colophon:/secrets/colophon
    restart: "no"

  # The only source of truth. Password authentication everywhere, loopback included: the
  # image's default trusts every local connection, and here every service is local.
  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    network_mode: service:pod
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: colophon
      POSTGRES_DB: colophon
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres/owner_password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql
      - secrets-postgres:/run/secrets/postgres:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=colophon", "--dbname=colophon"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  # A disposable cache (D-015): no persistence, a memory cap, eviction when full. Its whole
  # configuration, password included, is the file the secrets job wrote.
  valkey:
    image: valkey/valkey:9.0.6-trixie@sha256:63346cb24a61221e76bdf41acce99b3968a9fa83d8122144deab45394b27b4f2
    network_mode: service:pod
    command: ["/run/secrets/valkey/valkey.conf"]
    volumes:
      - secrets-valkey:/run/secrets/valkey:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(sed -n 's/^requirepass //p' /run/secrets/valkey/valkey.conf)" valkey-cli -h 127.0.0.1 ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # Object storage for uploads (D-016). `--single-node` lays out the cluster on first start.
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    network_mode: service:pod
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - garage:/var/lib/garage
      - secrets-garage:/run/secrets/garage:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell; `garage health` exits 1 while the cluster is unavailable.
      test: ["CMD", "/garage", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # The bucket and Colophon's key, through Garage's admin API; safe to run again.
  storage:
    image: alpine:3.23@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2
    network_mode: service:pod
    configs:
      - source: init-storage
        target: /init-storage.sh
    command: ["sh", "/init-storage.sh"]
    volumes:
      - secrets-garage:/run/secrets/garage:ro
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

  # The database roles, with the generated passwords (`colophon admin init-roles`, D-173).
  roles:
    image: ${COLOPHON_IMAGE:-ghcr.io/akira-shirase-oss/colophon:0.1.0-alpha.3}
    network_mode: service:pod
    entrypoint: ["/usr/local/bin/colophon"]
    command: ["admin", "init-roles"]
    environment:
      COLOPHON_MIGRATION_DATABASE_URL_FILE: /run/secrets/colophon/migration_database_url
      COLOPHON_APP_PASSWORD_FILE: /run/secrets/colophon/app_password
    volumes:
      - secrets-colophon:/run/secrets/colophon:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The schema. Refuses a database holding migrations this image doesn't know.
  migrate:
    image: ${COLOPHON_IMAGE:-ghcr.io/akira-shirase-oss/colophon:0.1.0-alpha.3}
    network_mode: service:pod
    entrypoint: ["/usr/local/bin/colophon"]
    command: ["admin", "migrate"]
    environment:
      COLOPHON_MIGRATION_DATABASE_URL_FILE: /run/secrets/colophon/migration_database_url
    volumes:
      - secrets-colophon:/run/secrets/colophon:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: "no"

  # Colophon: the API, the worker and the Studio in one process (`--role all`), on
  # http://localhost:${COLOPHON_PORT:-8080}. Healthy once `colophon doctor` says ready.
  colophon:
    image: ${COLOPHON_IMAGE:-ghcr.io/akira-shirase-oss/colophon:0.1.0-alpha.3}
    network_mode: service:pod
    environment:
      COLOPHON_PUBLIC_URL: http://localhost:${COLOPHON_PORT:-8080}
      COLOPHON_LOG_FORMAT: pretty
      COLOPHON_DATABASE_URL_FILE: /run/secrets/colophon/database_url
      COLOPHON_CACHE_URL_FILE: /run/secrets/colophon/cache_url
      COLOPHON_S3_ENDPOINT: http://127.0.0.1:3900
      COLOPHON_S3_BUCKET: colophon
      # Not a secret: the key's id. Its secret half is generated.
      COLOPHON_S3_ACCESS_KEY: GK636f6c6f70686f6e2d717300
      COLOPHON_S3_SECRET_KEY_FILE: /run/secrets/colophon/s3_secret_key
    volumes:
      - secrets-colophon:/run/secrets/colophon:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "127.0.0.1:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret_file = "/run/secrets/garage/rpc_secret"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "127.0.0.1:3900"
      root_domain = ".s3.garage.localhost"

      [admin]
      api_bind_addr = "127.0.0.1:3903"
      admin_token_file = "/run/secrets/garage/admin_token"
      metrics_token_file = "/run/secrets/garage/metrics_token"

  # Compose substitutes $NAME in these scripts, so the shell's own variables are written $$NAME.
  make-secrets:
    content: |
      set -eu
      if [ -f /secrets/colophon/.complete ]; then
        echo "secrets: already generated; nothing to do"
        exit 0
      fi
      umask 077
      # 32 random bytes as base64url: safe in a URL and a config file without quoting.
      token() { head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n'; }
      hex() { head -c "$$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
      # write FILE OWNER VALUE: mode 0400, owned by the one service that reads it.
      write() {
        printf '%s\n' "$$3" >"$$1.tmp"
        chown "$$2" "$$1.tmp"
        chmod 0400 "$$1.tmp"
        mv "$$1.tmp" "$$1"
      }
      owner=$$(token); app=$$(token); cache=$$(token); s3=$$(hex 32)
      # PostgreSQL and Valkey run as uid 999, Colophon as 65532, Garage as root.
      write /secrets/postgres/owner_password 999:999 "$$owner"
      write /secrets/valkey/valkey.conf 999:999 "$$(printf '%s\n' \
        'bind 127.0.0.1' 'port 6379' 'protected-mode yes' \
        "requirepass $$cache" 'save ""' 'appendonly no' \
        'maxmemory 128mb' 'maxmemory-policy allkeys-lru')"
      write /secrets/garage/rpc_secret 0:0 "$$(hex 32)"
      write /secrets/garage/admin_token 0:0 "$$(token)"
      write /secrets/garage/metrics_token 0:0 "$$(token)"
      write /secrets/garage/s3_secret_key 0:0 "$$s3"
      write /secrets/colophon/migration_database_url 65532:65532 \
        "postgres://colophon:$$owner@127.0.0.1:5432/colophon"
      write /secrets/colophon/app_password 65532:65532 "$$app"
      write /secrets/colophon/database_url 65532:65532 \
        "postgres://colophon_app:$$app@127.0.0.1:5432/colophon"
      write /secrets/colophon/cache_url 65532:65532 "redis://:$$cache@127.0.0.1:6379"
      write /secrets/colophon/s3_secret_key 65532:65532 "$$s3"
      : >/secrets/colophon/.complete
      echo "secrets: generated"

  init-storage:
    content: |
      set -eu
      umask 077
      api=http://127.0.0.1:3903
      key=GK636f6c6f70686f6e2d717300
      bucket=colophon
      auth="Authorization: Bearer $$(cat /run/secrets/garage/admin_token)"
      get() { wget -q -T 10 -O - --header "$$auth" "$$api$$1"; }
      # post PATH JSON: the body goes through a file, so no secret is in an argument list.
      post() {
        printf '%s' "$$2" >/tmp/body
        wget -q -T 10 -O - --header "$$auth" --header 'Content-Type: application/json' \
          --post-file /tmp/body "$$api$$1"
        rm -f /tmp/body
      }
      for _ in $$(seq 60); do
        get /v2/GetClusterHealth 2>/dev/null | grep -q '"status": "healthy"' && break
        sleep 1
      done
      if get "/v2/GetKeyInfo?id=$$key" >/dev/null 2>&1; then
        echo "storage: key $$key exists"
      else
        post /v2/ImportKey "{\"accessKeyId\": \"$$key\", \"secretAccessKey\": \"$$(cat /run/secrets/garage/s3_secret_key)\", \"name\": \"colophon\"}" >/dev/null
        echo "storage: key $$key imported"
      fi
      if info=$$(get "/v2/GetBucketInfo?globalAlias=$$bucket" 2>/dev/null); then
        echo "storage: bucket $$bucket exists"
      else
        info=$$(post /v2/CreateBucket "{\"globalAlias\": \"$$bucket\"}")
        echo "storage: bucket $$bucket created"
      fi
      id=$$(printf '%s\n' "$$info" | sed -n 's/^ *"id": "\([0-9a-f]*\)".*/\1/p' | head -n 1)
      [ -n "$$id" ] || { echo "storage: no bucket id in Garage's answer" >&2; exit 1; }
      post /v2/AllowBucketKey "{\"bucketId\": \"$$id\", \"accessKeyId\": \"$$key\", \"permissions\": {\"read\": true, \"write\": true, \"owner\": false}}" >/dev/null
      echo "storage: $$key may read and write $$bucket"

volumes:
  postgres:
  garage:
  secrets-postgres:
  secrets-valkey:
  secrets-garage:
  secrets-colophon:

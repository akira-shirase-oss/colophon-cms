# Evidence only (builder E): the schedules load smoke, before (main) and after
# fix/schedules-list-bounded, three runners each, on a fresh stack — every result recorded as it came
# out, with the runner's CPU, and PostgreSQL's wait events sampled every 200 ms during each run.
# Never merged: it lives on evidence/tokens-smoke.
name: evidence-tokens

on:
  push:
    branches: [evidence/tokens-smoke]

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.version }} ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
        n: [1, 2, 3, 4]
        include:
          - version: before
            ref: a7977304d0c26fb761f1a16d5d6b5bc3dec9c0e8
          - version: after
            ref: 5c175b12e0547f465d4f45f88008731c32d56d53
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - name: Keep outgoing ports below the stack's
        run: sudo sysctl -w net.ipv4.ip_local_port_range="20000 50999"
      - name: The runner
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          git log --oneline -1
      - name: Start the stack
        run: scripts/stack.sh up
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Migrate
        run: scripts/migrate.sh
      - name: Tokens and members smokes, with wait events sampled
        continue-on-error: true
        run: |
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH" KEEP=0 DURATION=20s
          for smoke in members roles tokens schedules schedules; do
            ( while true; do
                docker compose -f deploy/compose.yaml exec -T postgres psql -U colophon -d colophon -Atc \
                  "SELECT coalesce(wait_event_type,'-') || '/' || coalesce(wait_event,'on-cpu') || CASE WHEN now() - query_start > interval '500 ms' THEN ' SLOW ' || left(regexp_replace(query, '\\s+', ' ', 'g'), 90) ELSE '' END FROM pg_stat_activity WHERE datname = 'colophon' AND state = 'active' AND pid <> pg_backend_pid()" 2>/dev/null
                sleep 0.2
              done ) >> "$RUNNER_TEMP/waits-$smoke.txt" &
            sampler=$!
            case "$smoke" in tokens) rate=200 ;; roles) rate=450 ;; *) rate=500 ;; esac
            RATE=$rate P99_MS=200 scripts/load.sh "$smoke" steady || echo "SMOKE FAILED: $smoke"
            kill "$sampler" 2>/dev/null || true
            echo "wait events during $smoke (samples of active backends):"
            sort "$RUNNER_TEMP/waits-$smoke.txt" | uniq -c | sort -rn | head -12
            echo "server lines about the pool, timeouts or 503s:"
            docker compose -f deploy/compose.yaml logs --no-color 2>/dev/null | grep -icE 'pool timed out|acquire|503|statement timeout' || true
          done

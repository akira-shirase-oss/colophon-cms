name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new security advisories appear without any code change.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust:
    name: rust (toolchain, fmt, clippy, test, docs, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to commit SHAs (spec §35).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-toolchain.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy on the crash tests (built only with the fault points)
        run: cargo clippy -p colophon-server --features fault-injection --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Micro-benchmarks, each run once unoptimized (they build and their inputs hold)
        run: cargo test -p colophon-bench --benches --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: scripts/check-architecture.sh
      - run: scripts/check-architecture.sh colophon-sim
      - name: Simulator sweep (2,000 seeds; a failure prints the seed to replay)
        run: cargo run --quiet --release --locked -p colophon-sim -- --seeds 2000
      - name: Simulator sweep, publishing (releases, the outbox and workers under leases)
        run: cargo run --quiet --release --locked -p colophon-sim -- --scenario publishing --seeds 1000

  # Micro-benchmarks (D-074): the pull request's merge commit against its base, both built and
  # timed on this one runner in alternating rounds (scripts/bench.sh compare). Runners' CPUs
  # differ about 2.4x by model, so stored numbers from another job would compare machines, not code;
  # that is also why pushes to main run nothing here. Fails when a benchmark is slower in every
  # round by more than 15% and 25 ns; the report is in the job summary and the artifact.
  benchmarks:
    name: benchmarks (this pull request against its base, on one runner)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit has to be here to be built.
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Time the base and this pull request (scripts/bench.sh compare)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/bench.sh compare "$BASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-comparison
          path: |
            target/bench-compare/report.md
            target/bench-compare/report.json
            target/bench-compare/runs.jsonl
            target/bench-compare/logs/
          retention-days: 30

  frontend:
    name: frontend (types, editor unit tests, Studio in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w @colophon/studio playwright install --with-deps chromium
      - run: scripts/frontend.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: studio-playwright-traces
          path: apps/studio/test-results/
          retention-days: 7

  # How the CLI reaches people without Rust (D-062, milestone V): the npm launcher picks the right
  # platform package and passes exit codes through, the packages assemble from release archives
  # checked against SHA256SUMS, `npm pack` ships exactly the expected files, the install script
  # verifies before it installs, and the Homebrew formula gets each platform's hash.
  distribution:
    name: distribution (npm launcher and packages, install script, Homebrew formula)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Launcher and assembler tests (packages/cli-npm)
        working-directory: packages/cli-npm
        run: npm test
      - name: The install script against fake releases served from a temporary directory
        run: scripts/test-install.sh
      - name: The Homebrew formula, rendered from a SHA256SUMS
        run: scripts/test-homebrew-formula.sh

  # The testing rule (D-018) from a clean clone: the real stack, the real binary, real outages,
  # the testbed in a browser, and a load smoke run.
  integration:
    name: integration (stack, outage tests, testbed in Chromium, load smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux hands outgoing connections ports from 32768 to 60999, which includes every port the
      # stack and its test servers listen on (53900 and up); with a dozen servers started back to
      # back and k6's thousands of connections, one eventually took 58090 first ("address in
      # use", twice). Keep outgoing ports below them.
      - name: Keep outgoing ports below the stack's
        run: sudo sysctl -w net.ipv4.ip_local_port_range="20000 50999"
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          scripts/*.sh
      - name: Start the stack and run its checks
        run: scripts/stack.sh up
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Migrate the stack's database
        run: scripts/migrate.sh
      # Before the stack tests: the site test runs the reference site's runner (apps/web) with Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests that need the stack (they stop and restart its services)
        # Compiled against the live, migrated schema rather than .sqlx/: catches stale query data.
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: postgres://colophon:colophon-dev@127.0.0.1:55432/colophon
        run: cargo test --workspace --locked -- --ignored --test-threads=1
      - name: Crash tests F01, F02 and F03 (the server killed before and after a commit, the worker after announcing)
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: postgres://colophon:colophon-dev@127.0.0.1:55432/colophon
        run: cargo test -p colophon-server --features fault-injection --test faults --locked -- --ignored --test-threads=1
      - run: npx -w @colophon/testbed playwright install --with-deps chromium
      - name: Testbed in Chromium (scripts/testbed.sh)
        run: scripts/testbed.sh
      - name: The Studio against the real server (scripts/studio.sh)
        run: scripts/studio.sh
      - name: Log the plans of slow queries during the load smoke runs
        # Sampled, so it costs the smoke runs almost nothing; printed below if a step fails. Plans
        # don't cover COMMIT or lock waits, so statements over 100 ms (COMMIT included) and waits
        # for a lock over 50 ms are logged too: the stalls these runs have hit queued on a row lock
        # behind a transaction that was slow somewhere a plan can't show.
        run: |
          docker compose -f deploy/compose.yaml exec -T postgres psql -U colophon -d colophon \
            -c "ALTER SYSTEM SET session_preload_libraries = 'auto_explain'" \
            -c "ALTER SYSTEM SET auto_explain.log_min_duration = '40ms'" \
            -c "ALTER SYSTEM SET auto_explain.log_analyze = on" \
            -c "ALTER SYSTEM SET auto_explain.sample_rate = 0.25" \
            -c "ALTER SYSTEM SET log_min_duration_statement = '100ms'" \
            -c "ALTER SYSTEM SET log_lock_waits = on" \
            -c "ALTER SYSTEM SET deadlock_timeout = '50ms'" \
            -c "SELECT pg_reload_conf()"
      - name: Load smoke runs (health, rich-text validation, signed-in and bearer requests, members, custom roles, API tokens, schedules, who may create projects, changesets, public delivery, publishing with the worker, drafts, content types, content modelling, deleting entries, the Studio)
        # Endpoints that never touch the database run back to back (throughput): their p99 has
        # threefold headroom even on the slowest runner seen, and health's requests a second say
        # how fast this runner is. Database-backed endpoints run at a fixed rate (steady), about
        # half what the slowest runner seen managed back to back, against the same p99 thresholds:
        # back to back, 64 clients waiting on each answer make the average latency 64 divided by
        # throughput (Little's law), so the p99 measured the runner, not the code. Step 2.4's runs
        # showed it: changesets did 1,916 requests a second (p99 79 ms) on an EPYC 9V45 and 783
        # (p99 276 ms) on an EPYC 7763, where health did 44,243 and 18,613; plain 2.3 code failed the
        # same way. A fixed rate still fails on a slower query (p99) or lost capacity (k6 drops
        # iterations it can't start on time; more than 0.01% fails the run). Roles and schedules
        # follow the same rule since R.3: at 1,000 a second the roles smoke dropped 433 to 947
        # iterations on every EPYC 7763 and passed on every 9V45, while e/schedules and R.3 builds
        # did the same back to back on one laptop (1,532 to 1,733 a second). Back to back, the
        # laptop does 1,461 changesets, 1,722 roles and 1,856 schedules requests a second; a 7763
        # did 783 changesets, so about 920 roles and 990 schedules: half is 450 and 500. Members and
        # the CLI had stayed at 1,000, about 94% of a 7763 (the laptop does 1,993 and 1,979 a second
        # back to back, so a 7763 about 1,070): on 2026-10-28 members failed on p99 (203 ms, nothing
        # dropped, invitations and role changes queueing on one membership row) on an EPYC 9V74, where
        # the same hour's passing runs of earlier branches spread from 4 ms to 177 ms by runner, and
        # the CLI failed on a 7763.
        # Half is 500 each. Tokens failed twice at 400; until its million-request run gives a
        # back-to-back figure, it runs at 200. Session ran at 1,000 until a slow EPYC 7763 (rich-text
        # 10,838 a second against about 12,900 on others) served only 833 session requests a second,
        # median 587 ms; limits on or off made no difference to it on the laptop (2,110 to 2,465
        # off, 2,235 to 2,544 on, alternating), so it runs at 400, about half of that runner.
        # Projects failed next at 1,000 on a 7763 (p99 237 ms, 10 dropped): its admin's GET /me
        # (median 120 ms against 2.7 ms for the editor's) returns every project the admin is in, up
        # to 1,000, and the suites before the smokes create hundreds as dev-owner. It runs at 500
        # until /me stops listing every project (docs/modules/04-api.md, open decisions).
        run: |
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH" KEEP=0 DURATION=20s
          TOTAL=200000 P99_MS=50 scripts/load.sh health throughput
          TOTAL=100000 P99_MS=50 scripts/load.sh rich-text throughput
          RATE=400 P99_MS=200 scripts/load.sh session steady
          RATE=500 P99_MS=200 scripts/load.sh cli steady
          RATE=500 P99_MS=200 scripts/load.sh members steady
          RATE=450 P99_MS=200 scripts/load.sh roles steady
          RATE=200 P99_MS=200 scripts/load.sh tokens steady
          RATE=500 P99_MS=200 scripts/load.sh schedules steady
          RATE=500 P99_MS=200 scripts/load.sh projects steady
          RATE=400 P99_MS=200 scripts/load.sh changesets steady
          RATE=1500 P99_MS=200 scripts/load.sh delivery steady
          # RATE counts publishes here, five requests each.
          RATE=60 P99_MS=500 scripts/load.sh publishing steady
          RATE=400 P99_MS=500 scripts/load.sh entries steady
          RATE=400 P99_MS=500 scripts/load.sh content-types steady
          # Structures and references (M.1 to M.3): about 1,156 a second back to back on the
          # laptop, so about 600 on a 7763; half is 300.
          RATE=300 P99_MS=500 scripts/load.sh modelling steady
          # Deleting entries (D-080): RATE counts iterations, about 2.3 requests each. About 590
          # a second back to back on the laptop (1,284 requests), so about 300 on a 7763; half
          # is 150.
          RATE=150 P99_MS=500 scripts/load.sh deletion steady
          TOTAL=50000 P99_MS=50 scripts/load.sh studio throughput
      - name: Service logs, and what the database was doing
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml logs --no-color --tail 200
          # Open transactions hold back cleanup; dead rows show tables it couldn't clean.
          docker compose -f deploy/compose.yaml exec -T postgres psql -U colophon -d colophon \
            -c "SELECT pid, usename, state, now() - xact_start AS open_for, left(query, 80) AS query FROM pg_stat_activity WHERE datname = 'colophon' ORDER BY xact_start NULLS LAST" \
            -c "SELECT relname, n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze FROM pg_stat_user_tables ORDER BY n_dead_tup DESC LIMIT 15" \
            || true
          docker compose -f deploy/compose.yaml logs --no-color postgres | sed 's/^postgres-1  | //' \
            | awk '/ plan:$/ { left = 75 } left > 0 { print; left-- }' | head -900 || true
          docker compose -f deploy/compose.yaml logs --no-color postgres | sed 's/^postgres-1  | //' \
            | grep -E 'duration: [0-9.]+ ms  (statement|execute)|still waiting for|acquired .* after' | head -300 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/testbed/test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        run: scripts/stack.sh reset

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

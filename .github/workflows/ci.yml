name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new security advisories appear without any code change.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust:
    name: rust (toolchain, fmt, clippy, test, docs, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to commit SHAs (spec §35).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-toolchain.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: scripts/check-architecture.sh

  stack:
    name: scripts and local stack (shellcheck, compose up, prove each service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          scripts/*.sh
      - name: Start the stack and run its checks
        run: scripts/stack.sh up
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: scripts/stack.sh reset

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new security advisories appear without any code change.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust:
    name: rust (toolchain, fmt, clippy, test, docs, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to commit SHAs (spec §35).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-toolchain.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy on the crash tests (built only with the fault points)
        run: cargo clippy -p colophon-server --features fault-injection --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Micro-benchmarks, each run once unoptimized (they build and their inputs hold)
        run: cargo test -p colophon-bench --benches --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: scripts/check-architecture.sh
      - run: scripts/check-architecture.sh colophon-sim
      - name: Simulator sweep (2,000 seeds; a failure prints the seed to replay)
        run: cargo run --quiet --release --locked -p colophon-sim -- --seeds 2000
      - name: Simulator sweep, publishing (releases, the outbox and workers under leases)
        run: cargo run --quiet --release --locked -p colophon-sim -- --scenario publishing --seeds 1000

  # Micro-benchmarks (D-074): the pull request's merge commit against its base, both built and
  # timed on this one runner in alternating rounds (scripts/bench.sh compare). Runners' CPUs
  # differ about 2.4x by model, so stored numbers from another job would compare machines, not code;
  # that is also why pushes to main run nothing here. Fails when a benchmark is slower in every
  # round by more than 15% and 25 ns; the report is in the job summary and the artifact.
  benchmarks:
    name: benchmarks (this pull request against its base, on one runner)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit has to be here to be built.
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Time the base and this pull request (scripts/bench.sh compare)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/bench.sh compare "$BASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-comparison
          path: |
            target/bench-compare/report.md
            target/bench-compare/report.json
            target/bench-compare/runs.jsonl
            target/bench-compare/logs/
          retention-days: 30

  frontend:
    name: frontend (types, editor unit tests, Studio in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chromium and its system packages (retried — Ubuntu's mirrors fail intermittently)
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          RETRY_DELAY=45 scripts/retry.sh 3 npx -w @colophon/studio playwright install --with-deps chromium
      - run: scripts/frontend.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: studio-playwright-traces
          path: apps/studio/test-results/
          retention-days: 7

  # How the CLI reaches people without Rust (D-062, milestone V): the npm launcher picks the right
  # platform package and passes exit codes through, the packages assemble from release archives
  # checked against SHA256SUMS, `npm pack` ships exactly the expected files, the install script
  # verifies before it installs, and the Homebrew formula gets each platform's hash.
  distribution:
    name: distribution (npm launcher and packages, install script, Homebrew formula)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Launcher and assembler tests (packages/cli-npm)
        working-directory: packages/cli-npm
        run: npm test
      - name: The install script against fake releases served from a temporary directory
        run: scripts/test-install.sh
      - name: The Homebrew formula, rendered from a SHA256SUMS
        run: scripts/test-homebrew-formula.sh
      - name: CI's retry wrapper (scripts/test-retry.sh)
        run: scripts/test-retry.sh
      - name: The quick start's --keep leaves the project and its folder (scripts/test-quickstart-keep.sh)
        run: scripts/test-quickstart-keep.sh
      - name: The droplet's logical backup (deploy/droplet/test-backup-logical.sh)
        run: deploy/droplet/test-backup-logical.sh
      - name: The droplet's Neon URL fix (deploy/droplet/test-neon-url.sh)
        run: deploy/droplet/test-neon-url.sh
      - name: The droplet's edge channel refuses what it can't prove (deploy/droplet/test-upgrade-edge.sh, D-211)
        run: deploy/droplet/test-upgrade-edge.sh
      - name: The leftover test database sweep (scripts/test-sweep-test-databases.sh, D-195)
        run: scripts/test-sweep-test-databases.sh
      - name: The shared-stack guard (scripts/test-stack-guard.sh, D-187)
        run: scripts/test-stack-guard.sh
      - name: Backup keys are created mode 600 (scripts/test-backup-key-mode.sh)
        run: scripts/test-backup-key-mode.sh
      - name: Backups and restores leave no plaintext on failure or kill (scripts/test-backup-plaintext.sh)
        run: scripts/test-backup-plaintext.sh
      - name: A restore whose payload fails its hash is blocked, with why (scripts/test-restore-blocked.sh, D-196)
        run: scripts/test-restore-blocked.sh
      - name: Every load smoke check.sh runs, CI runs too (scripts/test-smoke-parity.sh, D-209)
        run: scripts/test-smoke-parity.sh
      - name: The smokes job's strict verdict on its expected failures (scripts/test-smoke-verdict.sh, D-209)
        run: scripts/test-smoke-verdict.sh
      - name: perf-compare reads every admission level, N=1 behind libtest's prefix too (scripts/test-admission-lines.sh)
        run: scripts/test-admission-lines.sh
      - name: The load runs' warnings gate (scripts/test-load-warnings.sh, D-221 evidence under 1 s excused)
        run: scripts/test-load-warnings.sh
      - name: A smoke is re-run only for a runner IO stall, once, and the re-run decides (scripts/test-run-smoke.sh)
        run: scripts/test-run-smoke.sh
      - name: The write probe discards runs inside a disk stall and falls back loudly (scripts/test-runner-speed.sh, D-223)
        run: scripts/test-runner-speed.sh

  # The testing rule (D-018) from a clean clone: the real stack, the real binary, real outages,
  # the testbed in a browser, and a load smoke run.
  integration:
    name: integration (stack, outage tests, testbed in Chromium, load smoke)
    runs-on: ubuntu-latest
    # Measured on main at 94e63c0 (run 44005647998): about 25 minutes to the load smoke runs,
    # which take about 7 more; 30 cancelled the job mid-smoke. Room for the suite to grow, not
    # for a hang: every step below has deadlines of its own. 50 → 65 after CI 44680118124 ran out at
    # 50.5 minutes, still passing (16 of 19 load smokes in): the job took 40–47 minutes on green runs
    # once the publishing flow's Studio specs came in (stack tests up to 1,127 s, the Studio up to
    # 1,051 s). Splitting it into two jobs is the follow-up.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux hands outgoing connections ports from 32768 to 60999, which includes every port the
      # stack and its test servers listen on (53900 and up); with a dozen servers started back to
      # back and k6's thousands of connections, one eventually took 58090 first ("address in
      # use", twice). Keep outgoing ports below them.
      - name: Keep outgoing ports below the stack's
        run: sudo sysctl -w net.ipv4.ip_local_port_range="20000 50999"
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          scripts/*.sh deploy/droplet/*.sh
      - name: Start the stack and run its checks
        run: scripts/stack.sh up
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Migrate the stack's database
        run: scripts/migrate.sh
      # D-156 against a real server: a TLS-only postgres of the script's own with a private CA,
      # the real CLI connecting (verify-full connects; a wrong name, an unknown issuer and plain
      # text fail; require, verify-ca and channel_binding=require are refused before connecting).
      - name: Database TLS against a private CA (scripts/db-tls-check.sh)
        run: scripts/db-tls-check.sh
      # Before the stack tests: the site test runs the reference site's runner (apps/web) with Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests that need the stack (they stop and restart its services)
        # Compiled against the live, migrated schema rather than .sqlx/: catches stale query data.
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: postgres://colophon:colophon-dev@127.0.0.1:55432/colophon
        run: |
          scripts/sweep-test-databases.sh
          cargo test --workspace --locked -- --ignored --test-threads=1
      - name: Crash tests F01, F02 and F03 (the server killed before and after a commit, the worker after announcing)
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: postgres://colophon:colophon-dev@127.0.0.1:55432/colophon
        run: cargo test -p colophon-server --features fault-injection --test faults --locked -- --ignored --test-threads=1
      - name: Chromium and its system packages (retried — Ubuntu's mirrors fail intermittently)
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          RETRY_DELAY=45 scripts/retry.sh 3 npx -w @colophon/testbed playwright install --with-deps chromium
      - name: Testbed in Chromium (scripts/testbed.sh)
        run: scripts/testbed.sh
      - name: The Studio against the real server (scripts/studio.sh)
        run: scripts/studio.sh
      - name: Log the plans of slow queries during the load smoke runs
        # Sampled, so it costs the smoke runs almost nothing; printed below if a step fails. Plans
        # don't cover COMMIT or lock waits, so statements over 100 ms (COMMIT included) and waits
        # for a lock over 50 ms are logged too: the stalls these runs have hit queued on a row lock
        # behind a transaction that was slow somewhere a plan can't show.
        run: |
          docker compose -f deploy/compose.yaml exec -T postgres psql -U colophon -d colophon \
            -c "ALTER SYSTEM SET session_preload_libraries = 'auto_explain'" \
            -c "ALTER SYSTEM SET auto_explain.log_min_duration = '40ms'" \
            -c "ALTER SYSTEM SET auto_explain.log_analyze = on" \
            -c "ALTER SYSTEM SET auto_explain.sample_rate = 0.25" \
            -c "ALTER SYSTEM SET log_min_duration_statement = '100ms'" \
            -c "ALTER SYSTEM SET log_lock_waits = on" \
            -c "ALTER SYSTEM SET deadlock_timeout = '50ms'" \
            -c "ALTER SYSTEM SET log_checkpoints = on" \
            -c "ALTER SYSTEM SET log_autovacuum_min_duration = 0" \
            -c "SELECT pg_reload_conf()"
      - name: Load smoke runs (health, rich-text validation, signed-in and bearer requests, members, custom roles, API tokens, schedules, who may create projects, changesets, public delivery, draft preview, publishing with the worker, drafts, content types, content modelling, deleting entries, the Studio)
        # Endpoints that never touch the database run back to back (throughput): their p99 has
        # threefold headroom even on the slowest runner seen, and health's requests a second say
        # how fast this runner is. Database-backed endpoints run at a fixed rate (steady), about
        # half what the slowest runner seen managed back to back, against the same p99 thresholds:
        # back to back, 64 clients waiting on each answer make the average latency 64 divided by
        # throughput (Little's law), so the p99 measured the runner, not the code. Step 2.4's runs
        # showed it: changesets did 1,916 requests a second (p99 79 ms) on an EPYC 9V45 and 783
        # (p99 276 ms) on an EPYC 7763, where health did 44,243 and 18,613; plain 2.3 code failed the
        # same way. A fixed rate still fails on a slower query (p99) or lost capacity (k6 drops
        # iterations it can't start on time; more than 0.01% fails the run). Roles and schedules
        # follow the same rule since R.3: at 1,000 a second the roles smoke dropped 433 to 947
        # iterations on every EPYC 7763 and passed on every 9V45, while e/schedules and R.3 builds
        # did the same back to back on one laptop (1,532 to 1,733 a second). Back to back, the
        # laptop does 1,461 changesets, 1,722 roles and 1,856 schedules requests a second; a 7763
        # did 783 changesets, so about 920 roles and 990 schedules: half is 450 and 500. Members and
        # the CLI had stayed at 1,000, about 94% of a 7763 (the laptop does 1,993 and 1,979 a second
        # back to back, so a 7763 about 1,070): on 2026-10-28 members failed on p99 (203 ms, nothing
        # dropped, invitations and role changes queueing on one membership row) on an EPYC 9V74, where
        # the same hour's passing runs of earlier branches spread from 4 ms to 177 ms by runner, and
        # the CLI failed on a 7763.
        # Half is 500 each. Tokens failed twice at 400; until its million-request run gives a
        # back-to-back figure, it runs at 200. Session ran at 1,000 until a slow EPYC 7763 (rich-text
        # 10,838 a second against about 12,900 on others) served only 833 session requests a second,
        # median 587 ms; limits on or off made no difference to it on the laptop (2,110 to 2,465
        # off, 2,235 to 2,544 on, alternating), so it runs at 400, about half of that runner.
        # Projects failed next at 1,000 on a 7763 (p99 237 ms, 10 dropped): its admin's GET /me
        # (median 120 ms against 2.7 ms for the editor's) returns every project the admin is in, up
        # to 1,000, and the suites before the smokes create hundreds as dev-owner. It runs at 500
        # until /me stops listing every project (docs/modules/04-api.md, open decisions).
        run: |
          set -o pipefail
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH" KEEP=0 DURATION=20s
          # D-221's evidence: statements over 100 ms (sqlx, INFO since D-224) and requests over 200 ms with their phases,
          # per smoke; each refusal on its own line (D-224) for the stall attribution.
          export LOAD_LOG=info,sqlx::query=info,colophon_api::refusals=debug,colophon_api::slow=debug,colophon_server::lag=debug
          logs="$RUNNER_TEMP/integration-logs"; mkdir -p "$logs"
          # The runner itself, every second (D-221's key): CPU steal, iowait and the run queue (vmstat), and how long
          # tasks waited for CPU, I/O and memory (/proc/pressure). Beside the server's lag tickers, a stall then says
          # whether the runner, the process or its runtime stopped.
          vmstat -t 1 >"$logs/vmstat.txt" 2>&1 &
          vmstat_pid=$!
          (while :; do echo "$(date -u +%FT%TZ) cpu: $(tr '\n' ' ' </proc/pressure/cpu)| io: $(tr '\n' ' ' </proc/pressure/io)| memory: $(tr '\n' ' ' </proc/pressure/memory)"; sleep 1; done) >"$logs/pressure.txt" 2>&1 &
          pressure_pid=$!
          trap 'kill "$vmstat_pid" "$pressure_pid" 2>/dev/null || true' EXIT
          ran=() failed=()
          # Each smoke runs to the end; the verdict below judges every outcome against perf/expected-smoke-failures.tsv
          # (scope integration: flapping entries may pass or fail their limit, never their 2x ceiling; D-221).
          run_load() {
            local name="integration/${*: -2:1}-${*: -1}"
            local file="${name//\//_}"
            ran+=("$name")
            echo "$(date -u +%FT%TZ) start $name" >>"$logs/windows.txt"
            # A hard failure inside a runner IO stall is re-run once and the re-run decides (scripts/run-smoke.sh).
            if ! scripts/run-smoke.sh "$name" "$logs/$file.record.json" "$logs/$file.server.log" "$logs/pressure.txt" -- "$@"; then
              echo "::warning::smoke failed: $* (the verdict below decides whether it was expected)"
              failed+=("$name")
            fi
            echo "$(date -u +%FT%TZ) end $name" >>"$logs/windows.txt"
            if [[ -s "$logs/$file.record.json" ]]; then
              jq -r --arg n "$name" '(.hard_failures // {}) as $h | [$n, (.latency_ms.p99 // ""), ([.l08.ratios[]?] | max // ""), (.hard_failures_total // ""), ([$h | to_entries[] | select(.key != "failed_checks" and (.value | type) == "number" and .value > 0) | "\(.key)=\(.value)"] + ($h.failed_checks // []) | join("; "))] | @tsv' "$logs/$file.record.json" >>"$logs/metrics.tsv"
            fi
          }
          run_load TOTAL=200000 P99_MS=50 scripts/load.sh health throughput
          # D-221: the steady smokes run at rates scaled to this runner's measured speed, so the relative load is the
          # same on every runner class (fixed rates sat near capacity on the slower ones: publishing p99 502 ms on an
          # EPYC 7763 at 17k health req/s, 14 ms on a 6975P at 39k). REFERENCE_RPS is where today's rates are clean;
          # a faster runner keeps them (scale capped at 1). Below half the reference the job says so, loudly.
          REFERENCE_RPS=38000
          # The runner's speed: the median of three short back-to-back health runs, so a noisy one can't set the scale.
          IFS=$'\t' read -r health_rps runner_cpu < <(scripts/runner-speed.sh 2>"$logs/runner-speed.log")
          if [[ -z "$health_rps" ]]; then
            echo "::warning::no health req/s measured: the steady smokes run at their reference rates (scale 1)"
            health_rps=$REFERENCE_RPS
          fi
          scale=$(awk -v h="$health_rps" -v r="$REFERENCE_RPS" 'BEGIN {s = h / r; if (s > 1) s = 1; printf "%.3f", s}')
          if awk -v s="$scale" 'BEGIN {exit !(s < 0.5)}'; then
            echo "::warning::this runner measured $health_rps health req/s, $(awk -v s="$scale" 'BEGIN {printf "%.0f", s * 100}')% of the reference $REFERENCE_RPS: the steady smokes' rates are scaled to it, and their numbers say little about the code"
          fi
          # The long health run above, beside the probe: REFERENCE_RPS is in long-run units, so a gap shows in every record.
          long_rps=$(jq -r '.rps // empty' "$logs/integration_health-throughput.record.json" 2>/dev/null || true)
          echo "| runner | ${runner_cpu:-unknown}: health $health_rps req/s (median of 3; long run ${long_rps:-not measured}), scale $scale of $REFERENCE_RPS |" >>"$GITHUB_STEP_SUMMARY"
          # Steady smokes are judged at their scaled rates even below the floor: the scaling keeps their relative load.
          export RUNNER_HEALTH_RPS=$health_rps RUNNER_LONG_HEALTH_RPS=${long_rps:-} RUNNER_REFERENCE_RPS=$REFERENCE_RPS RUNNER_SCALE=$scale RUNNER_JUDGED=yes
          # D-223's write probe, RECORD-ONLY for now (phase 1): entries saves back to back, in projects of their own,
          # runs inside a disk stall discarded. Calibrated from clean-class runs, phase 2 will scale the write smokes
          # by it; until then every smoke keeps health's scale. A probe with no run left says so, loudly.
          IFS=$'\t' read -r write_rps write_source write_kept write_discarded \
            < <(PRESSURE_FILE="$logs/pressure.txt" scripts/runner-speed.sh write 2>"$logs/write-probe.log")
          if [[ $write_source != probe ]]; then
            echo "::warning::the write probe counted no run (kept ${write_kept:-0}, discarded ${write_discarded:-0}): write_scale_source is fallback, health's scale stands"
            write_source=fallback
          fi
          echo "| write probe | ${write_rps:-none} req/s, $write_source (kept ${write_kept:-0}, discarded ${write_discarded:-0}; record-only, D-223) |" >>"$GITHUB_STEP_SUMMARY"
          export RUNNER_WRITE_RPS=${write_rps:-} RUNNER_WRITE_SOURCE=$write_source RUNNER_WRITE_KEPT=${write_kept:-0} RUNNER_WRITE_DISCARDED=${write_discarded:-0}
          rate() { awk -v r="$1" -v s="$scale" 'BEGIN {v = int(r * s + 0.5); if (v < 1) v = 1; print v}'; }
          run_load TOTAL=100000 P99_MS=50 scripts/load.sh rich-text throughput
          run_load RATE=$(rate 400) P99_MS=200 scripts/load.sh session steady
          run_load RATE=$(rate 500) P99_MS=200 scripts/load.sh cli steady
          run_load RATE=$(rate 500) P99_MS=200 scripts/load.sh members steady
          run_load RATE=$(rate 450) P99_MS=200 scripts/load.sh roles steady
          run_load RATE=$(rate 200) P99_MS=200 scripts/load.sh tokens steady
          run_load RATE=$(rate 500) P99_MS=200 scripts/load.sh schedules steady
          run_load RATE=$(rate 500) P99_MS=200 scripts/load.sh projects steady
          run_load RATE=$(rate 400) P99_MS=200 scripts/load.sh changesets steady
          run_load RATE=$(rate 1500) P99_MS=200 scripts/load.sh delivery steady
          # Draft preview reads (D-172): never cached, each re-checked as its issuer — the
          # spec's 200/s budget, at the drafts smoke's p99 until a runner baseline exists.
          run_load RATE=$(rate 200) P99_MS=500 scripts/load.sh preview steady
          # RATE counts publishes here, five requests each.
          run_load RATE=$(rate 60) P99_MS=500 scripts/load.sh publishing steady
          # Step 3.5 made the drafts mix heavier (title searches walk the collection, lists read
          # each entry's live state, revision reads are new): at 400/s a runner whose health ran
          # 21,982/s fell behind (p99 1.47 s on every endpoint, 224 iterations dropped; run
          # 40526045207), while the same code passed its million-request run locally. 300/s until a
          # back-to-back run on the slowest runner sets it at half, as above; END_GOAL's draft
          # workload is 20 writes and 100 reads a second.
          run_load RATE=$(rate 300) P99_MS=500 scripts/load.sh entries steady
          run_load RATE=$(rate 400) P99_MS=500 scripts/load.sh content-types steady
          # Structures and references (M.1 to M.3): about 1,156 a second back to back on the
          # laptop, so about 600 on a 7763; half is 300.
          run_load RATE=$(rate 300) P99_MS=500 scripts/load.sh modelling steady
          # Deleting entries (D-080): RATE counts iterations, about 2.3 requests each. About 590
          # a second back to back on the laptop (1,284 requests), so about 300 on a 7763; half
          # is 150.
          run_load RATE=$(rate 150) P99_MS=500 scripts/load.sh deletion steady
          # Images inside rich text (D-177, D-178): cached image-heavy reads, saves naming 20
          # images, refused saves. A first smoke; its rate is set from a runner's run.
          run_load RATE=$(rate 100) P99_MS=700 scripts/load.sh rich-text-media steady
          run_load TOTAL=50000 P99_MS=50 scripts/load.sh studio throughput
          touch "$logs/metrics.tsv"
          SMOKE_SCOPE=integration scripts/smoke-verdict.sh perf/expected-smoke-failures.tsv "${ran[*]}" "${failed[*]:-}" "$logs/metrics.tsv" \
            | tee -a "$logs/verdict.txt" "$GITHUB_STEP_SUMMARY"
      - name: Keep the load smokes' evidence (per-smoke server logs with slow requests, Postgres's checkpoints, autovacuum, lock waits and slow statements)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/integration-logs"
          docker compose -f deploy/compose.yaml logs --no-color --timestamps postgres >"$RUNNER_TEMP/integration-logs/postgres.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-smoke-logs
          path: ${{ runner.temp }}/integration-logs/
          retention-days: 7
      - name: Service logs, and what the database was doing
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml logs --no-color --tail 200
          # Open transactions hold back cleanup; dead rows show tables it couldn't clean.
          docker compose -f deploy/compose.yaml exec -T postgres psql -U colophon -d colophon \
            -c "SELECT pid, usename, state, now() - xact_start AS open_for, left(query, 80) AS query FROM pg_stat_activity WHERE datname = 'colophon' ORDER BY xact_start NULLS LAST" \
            -c "SELECT relname, n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze FROM pg_stat_user_tables ORDER BY n_dead_tup DESC LIMIT 15" \
            || true
          docker compose -f deploy/compose.yaml logs --no-color postgres | sed 's/^postgres-1  | //' \
            | awk '/ plan:$/ { left = 75 } left > 0 { print; left-- }' | head -900 || true
          docker compose -f deploy/compose.yaml logs --no-color postgres | sed 's/^postgres-1  | //' \
            | grep -E 'duration: [0-9.]+ ms  (statement|execute)|still waiting for|acquired .* after' | head -300 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          # The testbed's and the Studio's server specs' (playwright.server.config.ts keeps a trace
          # for each failed test): a UI failure in CI is then read from its trace, not rebuilt from
          # the server's log.
          path: |
            apps/testbed/test-results/
            apps/studio/test-results/
          retention-days: 7
      - name: Tear down
        if: always()
        run: scripts/stack.sh reset

  smokes:
    name: load smokes (every check.sh scenario integration doesn't run, outage drills included)
    runs-on: ubuntu-latest
    # Beside integration, not after it: its own runner and its own stack, so the full check's wall
    # time doesn't grow. These are check.sh's other 23 scenarios at check.sh's own settings
    # (D-209); scripts/test-smoke-parity.sh fails when check.sh gains one neither job runs. CI owns
    # this stack (D-187: CI=true), so cache-down and postgres-trouble may pause its Postgres and
    # Valkey here and nowhere else.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep outgoing ports below the stack's
        run: sudo sysctl -w net.ipv4.ip_local_port_range="20000 50999"
      # Which runner these numbers come from: smoke results are pass/fail checks, never capacity
      # claims, and they differ across runner CPUs (D-186's host check gates on this once it lands).
      - name: Record the runner
        run: |
          {
            echo "### Runner"
            echo "| CPU | cores | memory |"
            echo "|---|---|---|"
            echo "| $(lscpu | sed -n 's/^Model name: *//p') | $(nproc) | $(free -g | awk '/^Mem:/ {print $2}') GB |"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Start the stack
        run: scripts/stack.sh up
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Migrate the stack's database
        run: scripts/migrate.sh
      # Triage evidence (D-209): what a slow statement, a lock wait or a slow COMMIT looks like
      # on this runner, so a failed smoke can be told apart as the code's or the runner's.
      # Logging only; durability is untouched (never fsync off).
      - name: Log slow statements and lock waits; measure commit latency
        run: |
          set -euo pipefail
          pg() { docker compose -f deploy/compose.yaml exec -T postgres "$@"; }
          pg psql -U colophon -d postgres -XAtq \
            -c "ALTER SYSTEM SET log_min_duration_statement = '100ms'" \
            -c "ALTER SYSTEM SET log_lock_waits = on" -c "ALTER SYSTEM SET deadlock_timeout = '200ms'" \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'" \
            -c "SELECT pg_reload_conf()" >/dev/null
          # pg_stat_statements loads only at start: CI's own stack, restarted before any smoke.
          docker compose -f deploy/compose.yaml restart postgres >/dev/null
          for _ in $(seq 60); do pg pg_isready -q -U colophon && break; sleep 1; done
          pg psql -U colophon -d postgres -XAtqc "CREATE EXTENSION IF NOT EXISTS pg_stat_statements" >/dev/null
          fsync=$(pg sh -c 'pg_test_fsync -s 2 -f "$PGDATA/pg_test_fsync.probe"; rm -f "$PGDATA/pg_test_fsync.probe"' \
            | sed -n 's/^ *fdatasync *\([0-9.]*\) ops\/sec *\([0-9]*\) usecs\/op.*/\1 ops\/s, \2 µs\/op/p' | head -1)
          pg psql -U colophon -d postgres -XAtqc "CREATE TABLE IF NOT EXISTS commit_probe (n int)" >/dev/null
          printf 'INSERT INTO commit_probe VALUES (1);\n' | pg sh -c 'cat >/tmp/probe.sql'
          commit=$(pg pgbench -U colophon -n -c 1 -t 500 -f /tmp/probe.sql postgres 2>&1 | sed -n 's/^latency average = \(.*\)$/\1/p')
          pg psql -U colophon -d postgres -XAtqc "DROP TABLE commit_probe" >/dev/null
          {
            echo "### Storage, as Postgres sees it"
            echo "| fdatasync (pg_test_fsync) | INSERT+COMMIT, one client (pgbench, 500) |"
            echo "|---|---|"
            echo "| ${fsync:-not measured} | ${commit:-not measured} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load smokes, check.sh's settings (each runs; the failures must be exactly perf/expected-smoke-failures.tsv)
        run: |
          set -o pipefail
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH" KEEP=0 SAMPLE_RESOURCES=1 SAMPLE_SECONDS=1
          logs="$RUNNER_TEMP/smoke-logs"; mkdir -p "$logs"
          ran=() failed=()
          # D-221: every smoke's server runs its lag tickers, and the runner is sampled each second (as in integration).
          # D-224: the stall attribution's evidence (scripts/stall-signature.sh): statements from 100 ms at INFO (a short
          # stall's COMMITs are 100-220 ms) and each refusal on its own line. scripts/test-run-smoke.sh checks both.
          export LOAD_LOG=warn,sqlx::query=info,colophon_api::refusals=debug,colophon_server::lag=debug
          vmstat -t 1 >"$logs/vmstat.txt" 2>&1 &
          vmstat_pid=$!
          (while :; do echo "$(date -u +%FT%TZ) cpu: $(tr '\n' ' ' </proc/pressure/cpu)| io: $(tr '\n' ' ' </proc/pressure/io)| memory: $(tr '\n' ' ' </proc/pressure/memory)"; sleep 1; done) >"$logs/pressure.txt" 2>&1 &
          pressure_pid=$!
          trap 'kill "$vmstat_pid" "$pressure_pid" 2>/dev/null || true' EXIT
          # Each scenario keeps its server log, and marks its window so the Postgres log (one
          # for the job) can be cut by scenario.
          pgq() { docker compose -f deploy/compose.yaml exec -T postgres psql -U colophon -d postgres -XAtq "$@"; }
          # Before a stalled smoke's one re-run: keep its statement counts as <smoke>.stalled.statements.txt and reset them.
          export RUN_SMOKE_BEFORE_RERUN=scripts/save-smoke-statements.sh
          pgc=$(docker compose -f deploy/compose.yaml ps -q postgres)
          # D-221: this runner's speed (the median of three short back-to-back health runs) normalises the smokes. A
          # back-to-back smoke's p99 limit is scaled by max(1, REFERENCE / health) (fixed VUs: latency ≈ VUs / throughput);
          # a fixed-rate one runs at its rate × min(1, health / REFERENCE). Below half the reference the latency verdict
          # is not judged on this runner (said loudly), but hard failures are still enforced.
          REFERENCE_RPS=38000
          IFS=$'\t' read -r health_rps runner_cpu < <(scripts/runner-speed.sh 2>"$logs/runner-speed.log")
          if [[ -z "$health_rps" ]]; then
            echo "::warning::no health req/s measured: the smokes run at their reference rates and limits (scale 1)"
            health_rps=$REFERENCE_RPS
          fi
          scale=$(awk -v h="$health_rps" -v r="$REFERENCE_RPS" 'BEGIN {s = h / r; if (s > 1) s = 1; printf "%.3f", s}')
          judged=yes
          if awk -v s="$scale" 'BEGIN {exit !(s < 0.5)}'; then
            judged=no
            echo "::warning::this runner (${runner_cpu:-unknown}) measured $health_rps health req/s, under half the reference $REFERENCE_RPS: latency is not judged on it; hard failures still are"
          fi
          echo "| runner | ${runner_cpu:-unknown}: health $health_rps req/s (median of 3), scale $scale of $REFERENCE_RPS, latency judged: $judged |" >>"$GITHUB_STEP_SUMMARY"
          export RUNNER_HEALTH_RPS=$health_rps RUNNER_REFERENCE_RPS=$REFERENCE_RPS RUNNER_SCALE=$scale RUNNER_JUDGED=$judged SMOKE_LATENCY_JUDGED=$judged
          # D-223's write probe, RECORD-ONLY for now (phase 1): entries saves back to back, in projects of their own,
          # runs inside a disk stall discarded. Calibrated from clean-class runs, phase 2 will scale the write smokes
          # by it; until then every smoke keeps health's scale. A probe with no run left says so, loudly.
          IFS=$'\t' read -r write_rps write_source write_kept write_discarded \
            < <(PRESSURE_FILE="$logs/pressure.txt" scripts/runner-speed.sh write 2>"$logs/write-probe.log")
          if [[ $write_source != probe ]]; then
            echo "::warning::the write probe counted no run (kept ${write_kept:-0}, discarded ${write_discarded:-0}): write_scale_source is fallback, health's scale stands"
            write_source=fallback
          fi
          echo "| write probe | ${write_rps:-none} req/s, $write_source (kept ${write_kept:-0}, discarded ${write_discarded:-0}; record-only, D-223) |" >>"$GITHUB_STEP_SUMMARY"
          export RUNNER_WRITE_RPS=${write_rps:-} RUNNER_WRITE_SOURCE=$write_source RUNNER_WRITE_KEPT=${write_kept:-0} RUNNER_WRITE_DISCARDED=${write_discarded:-0}
          # The verdict scales a flapper's p99 ceiling by the same factor as its limit (limit() below: P99 / scale).
          export SMOKE_LIMIT_SCALE=$scale
          rate() { awk -v r="$1" -v s="$scale" 'BEGIN {v = int(r * s + 0.5); if (v < 1) v = 1; print v}'; }
          limit() { awk -v l="$1" -v s="$scale" 'BEGIN {printf "%d", l / s + 0.5}'; }
          smoke() {
            local name="${*: -2:1}" sampler snapshots
            ran+=("$name")
            echo "$(date -u +%FT%TZ) start $name" >>"$logs/windows.txt"
            echo "::group::$*"
            # Postgres's own side of the window: its container's CPU each second, and its
            # statements by total time, reset first so they're this scenario's alone.
            pgq -c "SELECT pg_stat_statements_reset()" >/dev/null || true
            (while :; do echo "$(date -u +%FT%TZ) $(docker stats --no-stream --format '{{.CPUPerc}}' "$pgc" 2>/dev/null)"; sleep 1; done) >"$logs/$name.postgres-cpu.txt" &
            sampler=$!
            # The oldest snapshot an application backend holds, each second: its xid age and how long its
            # transaction has been open. A long one keeps dead index entries from being marked dead, so queue
            # scans walk them (<smoke>.statements.txt's blks_per_call says how much a statement read).
            (while :; do echo "$(date -u +%FT%TZ) $(pgq -c "SELECT coalesce(max(age(backend_xmin)), 0) || ' xids ' || coalesce(round(max(extract(epoch FROM now() - xact_start)) FILTER (WHERE backend_xmin IS NOT NULL)::numeric, 1), 0) || ' s' FROM pg_stat_activity WHERE datname = 'colophon'" 2>/dev/null)"; sleep 1; done) >"$logs/$name.snapshots.txt" &
            snapshots=$!
            # A hard failure inside a runner IO stall is re-run once and the re-run decides (scripts/run-smoke.sh).
            if scripts/run-smoke.sh "$name" "$logs/$name.record.json" "$logs/$name.server.log" "$logs/pressure.txt" -- "$@"; then echo "::endgroup::"; else
              echo "::endgroup::"; echo "::warning::smoke failed: $* (the verdict below decides whether it was expected)"; failed+=("$name")
              # The work tables as the failure left them: what was queued, claimed, retried.
              docker compose -f deploy/compose.yaml exec -T postgres psql -U colophon -d colophon -XAq \
                -c "SELECT status, attempts, lease_owner IS NOT NULL AS leased, next_attempt_at > now() AS waiting, left(last_error, 200) AS last_error, count(*) FROM asset_jobs GROUP BY 1, 2, 3, 4, 5 ORDER BY 6 DESC LIMIT 20" \
                -c "SELECT state, count(*) FROM assets GROUP BY 1" >"$logs/$name.work-tables.txt" 2>&1 || true
            fi
            kill "$sampler" "$snapshots" 2>/dev/null || true
            # D-218's evidence, pass or fail: each upload's created → finished time and the backlog from
            # asset_jobs, and the worker's own work, fetch / decode / land times and claim sizes from its log.
            if [[ "$name" == assets ]]; then
              { echo "### assets: where an upload's time to usable goes (D-218)"; echo '```'
                scripts/asset-evidence.sh "$logs/$name.server.log" 2>&1 || echo "asset-evidence failed"
                echo '```'; } | tee "$logs/assets.evidence.txt" >>"$GITHUB_STEP_SUMMARY"
            fi
            # What the verdict judges by: each smoke's overall p99 and L08's worst noise/baseline ratio (a flapper's ceiling), and
            # its hard failures, never tolerated (the total, then which keys and checks).
            if [[ -s "$logs/$name.record.json" ]]; then
              jq -r --arg n "$name" '(.hard_failures // {}) as $h | [$n, (.latency_ms.p99 // ""), ([.l08.ratios[]?] | max // ""), (.hard_failures_total // ""), ([$h | to_entries[] | select(.key != "failed_checks" and (.value | type) == "number" and .value > 0) | "\(.key)=\(.value)"] + ($h.failed_checks // []) | join("; "))] | @tsv' "$logs/$name.record.json" >>"$logs/metrics.tsv"
            fi
            echo "$(date -u +%FT%TZ) end $name" >>"$logs/windows.txt"
            scripts/smoke-statements.sh >"$logs/$name.statements.txt" 2>&1 || true
            cpu=$(awk '{print $2}' "$logs/$name.postgres-cpu.txt" | tr -d '%' | awk 'NF {s += $1; n++; if ($1 > m) m = $1} END {if (n) printf "avg %.0f%%, max %.0f%%", s / n, m; else print "not sampled"}')
            oldest=$(awk '{print $2, $4}' "$logs/$name.snapshots.txt" | awk 'NF == 2 {if ($1 > x) x = $1; if ($2 > s) s = $2} END {printf "oldest snapshot %d xids, %.1f s", x, s}')
            echo "| $name | postgres CPU $cpu | $oldest |" >>"$GITHUB_STEP_SUMMARY"
          }
          # The worker at debug for assets alone: its per-attempt and per-claim timing lines are D-218's evidence.
          smoke LOAD_LOG=info,sqlx::query=info,colophon_api::refusals=debug,colophon_worker=debug TOTAL=10000 P99_MS=$(limit 500) scripts/load.sh assets throughput
          smoke TOTAL=10000 USERS=64 P99_MS=$(limit 700) scripts/load.sh audience throughput
          smoke TOTAL=10000 P99_MS=$(limit 500) scripts/load.sh bulk throughput
          smoke DURATION=10s P99_MS=$(limit 500) scripts/load.sh cache-down throughput
          smoke DURATION=10s RATE=$(rate 300) PUBLISH_SECONDS=5 P99_MS=400 scripts/load.sh cdn-warm throughput
          smoke TOTAL=5000 CORPUS=512 P99_MS=$(limit 750) scripts/load.sh cold-cache throughput
          smoke TOTAL=20000 P99_MS=$(limit 200) scripts/load.sh collaboration throughput
          smoke TOTAL_RECORDS=1024 P99_MS=$(limit 15000) scripts/load.sh import-scale throughput
          smoke TOTAL=10000 P99_MS=$(limit 500) scripts/load.sh live throughput
          smoke DURATION=10s MEDIA_VUS=2 P99_MS=$(limit 700) scripts/load.sh media-load throughput
          smoke TOTAL=10000 P99_MS=$(limit 500) scripts/load.sh migrations throughput
          smoke DURATION=15s RATE=$(rate 50) PUBLISH_SECONDS=5 P99_MS=700 scripts/load.sh mixed throughput
          smoke DURATION=8s P99_MS=$(limit 500) scripts/load.sh noisy-agent throughput
          smoke DURATION=8s P99_MS=$(limit 250) scripts/load.sh password-flood throughput
          smoke DURATION=10s P99_MS=$(limit 500) scripts/load.sh postgres-trouble throughput
          smoke DURATION=10s P99_MS=$(limit 500) scripts/load.sh purge-trouble throughput
          smoke TOTAL=20000 P99_MS=$(limit 200) scripts/load.sh quotas throughput
          smoke TOTAL=10000 P99_MS=$(limit 500) scripts/load.sh site-starter throughput
          smoke DURATION=10s P99_MS=$(limit 700) scripts/load.sh smoke throughput
          # A limiter smoke (perf/limiter-smokes.tsv): its rate exceeds the fixed delivery limit, so it never scales.
          smoke DURATION=8s RATE=300 SPIKE_SECONDS=10 P99_MS=250 scripts/load.sh spike throughput
          smoke TOTAL=10000 P99_MS=$(limit 200) scripts/load.sh stages throughput
          smoke DURATION=15s P99_MS=$(limit 250) scripts/load.sh stampede throughput
          smoke TOTAL=8000 P99_MS=$(limit 700) scripts/load.sh undo throughput
          smoke TOTAL=50000 P99_MS=$(limit 350) scripts/load.sh warm-baseline throughput
          echo "| failed smokes | ${failed[*]:-none} (of ${#ran[@]} that ran) |" >>"$GITHUB_STEP_SUMMARY"
          # D-209 addendum: a strict entry must fail (its fix removes its line); a flapping one may pass or fail its limit
          # but never its ceiling (2x); anything unlisted that fails, fails. Each listed smoke's outcome and margin print.
          touch "$logs/metrics.tsv"
          scripts/smoke-verdict.sh perf/expected-smoke-failures.tsv "${ran[*]}" "${failed[*]:-}" "$logs/metrics.tsv" | tee -a "$logs/verdict.txt" "$GITHUB_STEP_SUMMARY"
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 300
      - name: Keep the evidence (server logs per scenario, Postgres's slow statements and lock waits)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-logs"
          docker compose -f deploy/compose.yaml logs --no-color --timestamps postgres >"$RUNNER_TEMP/smoke-logs/postgres.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke-logs
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/stack.sh reset

  # The quick start on a clean runner, exactly as documented (D-174, D-175): the image built
  # from source, deploy/quickstart/compose.yaml in an empty directory, `docker compose up -d
  # --wait`, the Studio and the API answering, the setup code from the logs, a newcomer's
  # journey in Chromium, and the data kept across `down` and `up`. Node is only for the
  # browser check; the install itself needs Docker alone.
  quickstart:
    name: quick start (image from source, compose up, Studio journey)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The Dockerfile passes hadolint
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
          < deploy/image/Dockerfile
      - name: The quick start's compose file is valid
        run: COLOPHON_IMAGE=colophon:local docker compose -f deploy/quickstart/compose.yaml config --quiet
      # The README's own build command, read from README.md and run exactly as written, with no build arguments:
      # the newcomer's path, so the docs and the test can't drift apart (a missing SOURCE_DATE_EPOCH broke it once;
      # release.yml keeps building with the commit's time for reproducible images). The rest of this job uses this
      # image.
      - name: Build the image from source, with the README's exact command
        run: |
          set -euo pipefail
          command=$(grep -m1 -E '^docker build -f deploy/image/Dockerfile ' README.md || true)
          if [[ -z $command || $command =~ [\;\&\|\$\`\<\>] || $command != *" -t colophon:local ." ]]; then
            echo "::error::README.md has no plain 'docker build -f deploy/image/Dockerfile ... -t colophon:local .' line (found '$command')"
            exit 1
          fi
          echo "Running the README's command: $command"
          t0=$SECONDS
          read -ra words <<<"$command"
          "${words[@]}"
          echo "Image built from source, as the README says, in $((SECONDS - t0)) s" >>"$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint /usr/local/bin/colophon-server colophon:local --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chromium and its system packages (retried — Ubuntu's mirrors fail intermittently)
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          RETRY_DELAY=45 scripts/retry.sh 3 npx -w @colophon/studio playwright install --with-deps chromium
      - name: Install k6 (pinned)
        run: |
          scripts/install-k6.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: The quick start, as documented (scripts/quickstart.sh)
        run: QUICKSTART_SHOTS="$PWD/apps/studio/test-results/screens" scripts/quickstart.sh --image colophon:local --browser --load --record
      - name: The production and droplet files (deploy/production, deploy/droplet) pass systemd-analyze and caddy validate
        run: |
          set -euo pipefail
          # verify checks that ExecStart's binary exists: the image's own.
          id=$(docker create colophon:local)
          sudo docker cp "$id:/usr/local/bin/colophon-server" /usr/local/bin/colophon-server
          sudo docker cp "$id:/usr/local/bin/colophon" /usr/local/bin/colophon
          docker rm "$id" >/dev/null
          systemd-analyze verify deploy/production/colophon.service
          docker run --rm -e COLOPHON_DOMAIN=cms.example.com -v "$PWD/deploy/production:/etc/caddy:ro" \
            caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # The S0 droplet's files (deploy/droplet): its units, and its Caddyfile with a throwaway
          # certificate standing in for Cloudflare's origin certificate.
          sudo install -m 0755 deploy/droplet/backup-logical.sh /usr/local/bin/colophon-backup-logical
          systemd-analyze verify deploy/droplet/colophon-ledger-export.service deploy/droplet/colophon-ledger-export.timer \
            deploy/droplet/colophon-backup-logical.service deploy/droplet/colophon-backup-logical.timer
          caddy_dir=$(mktemp -d)
          cp deploy/droplet/Caddyfile deploy/droplet/cloudflare-origin-pull-ca.pem "$caddy_dir/"
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=app.colophon.404human.dev -days 1 \
            -keyout "$caddy_dir/origin.key" -out "$caddy_dir/origin.pem" 2>/dev/null
          echo 'trusted_proxies static 173.245.48.0/20 2400:cb00::/32' >"$caddy_dir/cloudflare-trusted.caddy"
          docker run --rm -v "$caddy_dir:/etc/caddy:ro" \
            caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: The shipped unit reads its secrets through systemd credentials, over verify-full (deploy/droplet/test-unit-credentials.sh)
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          id=$(docker create colophon:local)
          docker cp "$id:/usr/local/bin/colophon-server" "$out/colophon-server"
          docker cp "$id:/usr/local/bin/colophon" "$out/colophon"
          docker cp "$id:/usr/share/colophon/studio" "$out/studio"
          docker rm "$id" >/dev/null
          sudo CI=true deploy/droplet/test-unit-credentials.sh "$out/colophon-server" "$out/colophon" "$out/studio"
      - name: Every 'colophon admin' command the droplet runs exists in the CLI (deploy/droplet/test-unit-commands.sh)
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          id=$(docker create colophon:local)
          docker cp "$id:/usr/local/bin/colophon" "$out/colophon"
          docker rm "$id" >/dev/null
          deploy/droplet/test-unit-commands.sh "$out/colophon"
      - name: Timings and sizes
        if: always()
        run: |
          for file in perf/results/*-quickstart-*.json; do
            [[ -f "$file" ]] || continue
            jq -r '"| First `up --wait` | \(.seconds.first_up_wait) s |\n| Restart `up --wait` | \(.seconds.second_up_wait) s |\n| Colophon cold start | \(.seconds.colophon_cold_start) s |\n| Image, compressed | \(.image.compressed_bytes / 1000000 | floor) MB |\n| Colophon idle memory | \(.colophon_idle_memory) |"' "$file" \
              | { echo '| Quick start | |'; echo '|---|---|'; cat; } >>"$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quickstart
          path: |
            perf/results/*-quickstart-*.json
            apps/studio/test-results/
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The Next.js demo site has its own npm tree, outside the CMS's workspaces (D-220), so it is audited on its
      # own and reported separately: a finding here is the demo's, never the CMS's.
      - name: The Next.js demo's own npm tree (apps/sites/nextjs, not part of the CMS)
        working-directory: apps/sites/nextjs
        run: npm audit --omit=dev --audit-level=moderate

  nextjs-demo:
    # The Next.js demo site (D-220) lives outside the CMS's npm workspaces, with its own package-lock.json. This job
    # installs it on its own and runs only when it or the API contract it reads changes, and on main.
    name: Next.js demo (its own install, types, tests, an unseeded build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change touch the demo or the API contract?
        id: scope
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then echo "run=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          base=$(git merge-base HEAD origin/main)
          if git diff --name-only "$base" HEAD | grep -qE '^(apps/sites/nextjs/|docs/api/openapi\.json$)'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"; echo "Nothing the Next.js demo depends on changed; skipped."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
      - name: Install exactly what its package-lock.json pins
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/sites/nextjs
        run: npm ci --no-audit --no-fund
      - name: Types, the delivery-read tests, and a build with nothing seeded
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/sites/nextjs
        run: |
          npm run check
          npm test
          npm run build
          test -f dist/index.html

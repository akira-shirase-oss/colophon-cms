[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/akira-shirase-oss/colophon-cms"
# Nothing is published until the licence is confirmed (DECISIONS.md, O-014).
publish = false

[workspace.dependencies]
# Internal crates.
colophon-domain = { path = "crates/colophon-domain" }
colophon-db = { path = "crates/colophon-db" }
colophon-api = { path = "crates/colophon-api" }

# External crates: versions live here only (rust-mastery chapter 15). Minimal features;
# one async runtime (Tokio); no TLS stack until a feature needs one.
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
futures-util = { version = "0.3", default-features = false }
http-body = "1.1"
http-body-util = "0.1.5"
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "timeout", "limit", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

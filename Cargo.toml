[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# One semantic version for the server, worker, CLI, SDK and MCP server (D-062); the policy is in
# docs/modules/19-oss.md, "Versions". The release workflow refuses a tag that doesn't match it.
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/akira-shirase-oss/colophon-cms"
# Nothing is published until the licence is confirmed (DECISIONS.md, O-014).
publish = false

[workspace.dependencies]
# Internal crates.
colophon-domain = { path = "crates/colophon-domain" }
colophon-db = { path = "crates/colophon-db" }
colophon-media = { path = "crates/colophon-media" }
colophon-api = { path = "crates/colophon-api" }
colophon-auth = { path = "crates/colophon-auth" }
colophon-sim = { path = "crates/colophon-sim" }
colophon-worker = { path = "crates/colophon-worker" }
colophon-version = { path = "crates/colophon-version" }
colophon-mcp = { path = "crates/colophon-mcp" }

# External crates: versions live here only (rust-mastery chapter 15). Minimal features;
# one async runtime (Tokio); no TLS stack until a feature needs one.
anyhow = "1.0.104"
argon2 = "0.5.3"
# The GraphQL executor for the per-collection endpoint (DX.10, D-115): the schema is built
# per request from the project's content types (`dynamic-schema`), resolvers compile each
# read to the same bounded query document `POST …/entries/query` runs. No `graphiql`,
# `playground`, `email-validator` or `tempfile` (the default features pull those in).
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
aws-lc-rs = { version = "1.15", default-features = false, features = ["aws-lc-sys"] }
axum = "0.8.9"
base64 = "0.22"
bytes = "1.12"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# Micro-benchmarks only (crates/colophon-bench, D-074). No default features: no plots (plotters),
# no rayon (it only parallelizes the statistics after measuring); scripts/bench.sh reads the
# estimates Criterion writes as JSON.
criterion = { version = "0.8.2", default-features = false }
futures-util = { version = "0.3", default-features = false }
http-body = "1.1"
http-body-util = "0.1.5"
# Bounded image decode for uploaded assets (M2; the declared type is never trusted). Only the
# v0.1 formats: png, jpeg, webp — no gif (animated decoders complicate pixel budgets) and no svg.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
# The CLI compares its version with the server's by SemVer precedence (D-062).
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "timeout", "limit", "catch-panic", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
# Scheduled publishing resolves local times in IANA time zones (D-060); the bundled database
# makes every machine resolve them the same way, with no I/O.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# One object-store abstraction over S3 (Garage locally, managed buckets live; D-016): the same
# code runs the in-memory backend in tests.
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
# Text patterns in content types (step M.4): linear-time matching, so no pattern can stall a save.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

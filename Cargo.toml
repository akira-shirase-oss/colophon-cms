[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/akira-shirase-oss/colophon-cms"
# Nothing is published until the licence is confirmed (DECISIONS.md, O-014).
publish = false

[workspace.dependencies]
# Internal crates.
colophon-domain = { path = "crates/colophon-domain" }
colophon-db = { path = "crates/colophon-db" }
colophon-api = { path = "crates/colophon-api" }

# External crates: versions live here only (rust-mastery chapter 15).
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

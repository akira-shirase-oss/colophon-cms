# Supply-chain policy, checked by cargo-deny on every push and daily (new advisories
# appear without code changes). Starting point: rust-mastery chapter 11, "Supply chain".

[graph]
all-features = true

[advisories]
# Vulnerabilities and unmaintained crates fail by default. Ignore only with a reason and an expiry.
ignore = [
    # chrono, and humantime which wraps it, were declared unmaintained on 2026-11-17. Neither is a
    # vulnerability and no release is safe to move to; both reach us only through object_store 0.14
    # (the S3 client). Expires 2026-12-17: by then an object_store without them, or triage again.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no fix; only via object_store 0.14; expires 2026-12-17" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained, no fix; only via object_store 0.14; expires 2026-12-17" },
]

[licenses]
# BSL-1.0 (Boost): permissive and OSI-approved; needed by xxhash-rust, through redis (2026-10-25).
# CDLA-Permissive-2.0: a permissive licence for data; it covers the Mozilla root certificates in
# webpki-root-certs, which TLS verification needs (2026-10-26).
# BSD-2-Clause: permissive and OSI-approved; needed by Inflector, through async-graphql-derive
# (2026-11-04).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
# The allowlist names licences we accept ahead of the dependencies that will need them.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are MIT (D-158) and `publish = false`: they ship through releases and npm.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version. That is only a problem for
# published crates, and these are `publish = false`.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "use rustls: one TLS stack to patch" },
    { crate = "openssl-sys", reason = "use rustls: one TLS stack to patch" },
    { crate = "async-std", reason = "one async runtime: tokio" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

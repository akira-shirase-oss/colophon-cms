# Supply-chain policy, checked by cargo-deny on every push and daily (new advisories
# appear without code changes). Starting point: rust-mastery chapter 11, "Supply chain".

[graph]
all-features = true

[advisories]
# Vulnerabilities and unmaintained crates fail by default. Ignore only with a reason and an expiry.
ignore = []

[licenses]
# BSL-1.0 (Boost): permissive and OSI-approved; needed by xxhash-rust, through redis (2026-10-25).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
# The allowlist names licences we accept ahead of the dependencies that will need them.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false` until the licence is confirmed.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version. That is only a problem for
# published crates, and these are `publish = false`.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "use rustls: one TLS stack to patch" },
    { crate = "openssl-sys", reason = "use rustls: one TLS stack to patch" },
    { crate = "async-std", reason = "one async runtime: tokio" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

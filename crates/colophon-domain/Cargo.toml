[package]
name = "colophon-domain"
description = "Colophon's rules: content model, editorial workflow, releases and state machines. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Never add an async runtime, HTTP framework or database driver here (tokio, axum, hyper,
# tower, sqlx, reqwest, ...). scripts/check-architecture.sh fails CI if one appears, even
# transitively. See docs/modules/01-domain.md.
[dependencies]
# Time zones for scheduled publishing, with the tz database bundled: no I/O (D-060).
jiff.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
# Keeps fixture key order when re-serializing a fixture to compare it with the canonical form.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true

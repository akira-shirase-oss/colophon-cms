[package]
name = "colophon-api"
description = "Colophon's HTTP surface: the error envelope, request ids, middleware, health, and (from P1) /api/v1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exit at named points for the crash tests (src/fault.rs). Never in a release build.
fault-injection = []

[dependencies]
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
colophon-auth.workspace = true
colophon-db.workspace = true
colophon-domain.workspace = true
http-body.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower.workspace = true
tower-http.workspace = true
time = { workspace = true, features = ["formatting"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "colophon-db"
description = "Colophon's PostgreSQL adapter: transactions, the outbox, idempotency and row-level security context."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
aws-lc-rs.workspace = true
# The adapter implements the domain's ports (ARCHITECTURE.md): roles load as its policies (D-058).
colophon-domain.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# The ledger export writes `deleted_at` as RFC 3339 and the replay parses it back.
time = { workspace = true, features = ["formatting", "parsing"] }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
# The differential test replays simulated runs against Postgres (tests/differential.rs).
colophon-sim.workspace = true

[lints]
workspace = true

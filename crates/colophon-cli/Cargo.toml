[package]
name = "colophon-cli"
description = "The colophon command: scriptable, with stable JSON output and honest exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "colophon"
path = "src/main.rs"

[dependencies]
clap.workspace = true
colophon-db.workspace = true
colophon-version.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
uuid.workspace = true

[build-dependencies]
# build.rs stamps the commit and build date (D-062).
colophon-version = { workspace = true, features = ["stamp"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

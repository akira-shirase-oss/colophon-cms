[package]
name = "colophon-cli"
description = "The colophon command: scriptable, with stable JSON output and honest exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://github.com/akira-shirase-oss/colophon-cms"
keywords = ["cms", "headless-cms", "cli", "colophon"]
categories = ["command-line-utilities"]
# Not on crates.io yet (docs/modules/08-cli.md, "Install"): the licence isn't confirmed (O-014), and
# colophon-db, colophon-domain and colophon-version would have to be published first. Until then
# `cargo install --locked --git https://github.com/akira-shirase-oss/colophon-cms colophon-cli`.
publish.workspace = true

[[bin]]
name = "colophon"
path = "src/main.rs"

[dependencies]
clap.workspace = true
colophon-db.workspace = true
# `colophon mcp` is the same server as the `colophon-mcp` binary, linked in (D-119).
colophon-mcp.workspace = true
colophon-version.workspace = true
# `admin ledger export --s3-key` puts the snapshot in the object store (D-124).
object_store.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
# build.rs stamps the commit and build date (D-062).
colophon-version = { workspace = true, features = ["stamp"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

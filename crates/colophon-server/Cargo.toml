[package]
name = "colophon-server"
description = "The Colophon server binary: the composition root that runs the API role, the worker role, or both."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
colophon-api.workspace = true
colophon-auth.workspace = true
colophon-db.workspace = true
redis.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
# Cookies only for the Keycloak side of the sign-in test; Colophon's cookies are checked by hand.
reqwest = { workspace = true, features = ["cookies"] }
uuid.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "colophon-server"
description = "The Colophon server binary: the composition root that runs the API role, the worker role, or both."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The crash tests' fault points (colophon-api's src/fault.rs). Never in a release build.
fault-injection = ["colophon-api/fault-injection", "colophon-worker/fault-injection"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
colophon-api.workspace = true
colophon-auth.workspace = true
colophon-db.workspace = true
colophon-version.workspace = true
colophon-worker.workspace = true
redis.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[build-dependencies]
# build.rs stamps the commit and build date (D-062).
colophon-version = { workspace = true, features = ["stamp"] }

[dev-dependencies]
# Local times for the scheduled-publishing tests (tests/schedules.rs).
jiff.workspace = true
# The crash loop checks publication history with the domain's own rule (tests/crash_loop.rs).
colophon-domain.workspace = true
# Cookies only for the Keycloak side of the sign-in test; Colophon's cookies are checked by hand.
reqwest = { workspace = true, features = ["cookies"] }
uuid.workspace = true
serde_json.workspace = true
# Test setup the API can't do yet, such as adding a member with a given role.
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Crash tests (F01, F02): only with the fault points compiled in.
[[test]]
name = "faults"
required-features = ["fault-injection"]

[lints]
workspace = true
